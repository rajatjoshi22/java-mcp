spring.application.name=itenary
server.port=9094

# 1. Ollama Configuration
# Ensure you have run 'ollama pull llama3.1' in your terminal
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1

# Define the Docling server connection
# Format: spring.ai.mcp.client.stdio.connections.[name].command
spring.ai.mcp.client.annotation-scanner.enabled=true

# 3. DuckDuckGo MCP Connection (Replaces Brave Search)
# This uses npx to run the DuckDuckGo search server locally (Requires Node.js)
# Change 'npx' to 'npx.cmd'
spring.ai.mcp.client.stdio.connections.duckduckgo.command=npx.cmd
spring.ai.mcp.client.stdio.connections.duckduckgo.args=-y, duckduckgo-mcp-server




# 4. Logging (Helpful to see tool-calling in the console)
logging.level.org.springframework.ai=DEBUG